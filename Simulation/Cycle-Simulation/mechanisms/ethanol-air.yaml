  (nasa_gas.yaml, NASA TM-4513). No reaction kinetics are included: combustion
  is represented by a Wiebe heat-release model, so only mixture thermodynamics
  are required.

source: Species thermo extracted from the Cantera 3.2 bundled NASA database
  (nasa_gas.yaml, NASA TM-4513) on 2026-11-10.
