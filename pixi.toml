[workspace]
name = "destroyer-engine"
version = "0.1.0"
description = "Reproducible analysis environment for the Destroyer-01 engine"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
pandas = "*"
matplotlib = "*"
jupyterlab = "*"
cantera = "3.2.*"
calculix = "2.23.*"

[tasks]
test = "python Calculations/test_calculations.py"
spec = "python Calculations/analyse_spec.py"
lab = "jupyter lab"
