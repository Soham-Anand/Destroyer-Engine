[workspace]
name = "destroyer-engine"
version = "0.1.0"
description = "Reproducible analysis environment for the Destroyer-01 engine"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
pandas = "*"
matplotlib = "*"
jupyterlab = "*"
cantera = "3.2.*"
calculix = "2.23.*"

[tasks]
test = { depends-on = ["test-calculations", "test-cycle", "test-sound"] }
test-calculations = "python Calculations/test_calculations.py"
test-cycle = "python Simulation/Cycle-Simulation/test_cycle_model.py"
test-sound = "python Simulation/Acoustics/test_engine_sound.py"
spec = "python Calculations/analyse_spec.py"
sweep = "python Simulation/Cycle-Simulation/run_sweep.py"
sweep-tuned = "python Simulation/Cycle-Simulation/run_sweep.py --intake-pressure-kpa 106.325 --output Simulation/Cycle-Simulation/sweep-tuned-intake.csv"
sweep-cooling = "python Simulation/Cycle-Simulation/run_sweep.py --charge-cooling 0.50 --output Simulation/Cycle-Simulation/sweep-charge-cooling.csv"
sound = "python Simulation/Acoustics/engine_sound.py --rpm 4800 --duration 4.0 --plot"
lab = "jupyter lab"
